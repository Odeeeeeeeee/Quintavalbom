    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const FAQAdmin = () => {
            const [faqs, setFaqs] = useState([]);
            const [categories, setCategories] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');
            const [showModal, setShowModal] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({ category: '', question: '', answer: '' });
            const [activeTab, setActiveTab] = useState('faqs');
            const [newCategory, setNewCategory] = useState('');
            const [message, setMessage] = useState('');
            const [loading, setLoading] = useState(true);
            const [pendingQuestions, setPendingQuestions] = useState([]);
            const [editingPendingId, setEditingPendingId] = useState(null);
            const [pendingFormData, setPendingFormData] = useState({ category: '', answer: '' });
            const [aiSettings, setAiSettings] = useState({
                apiKey: '',
                model: 'claude-haiku-4-5',
                enabled: false,
                temperature: 0.5,
                debug: false
            });
            const [aiTestStatus, setAiTestStatus] = useState(null); // null | 'testing' | 'success' | 'error'
            const [aiTestMessage, setAiTestMessage] = useState('');
            const [showApiKey, setShowApiKey] = useState(false);
            const [questionCache, setQuestionCache] = useState({});
            const [cacheLanguageFilter, setCacheLanguageFilter] = useState('all');

            const reloadCache = () => {
                try {
                    const raw = localStorage.getItem('quinta_question_cache');
                    setQuestionCache(raw ? JSON.parse(raw) : {});
                } catch (e) { setQuestionCache({}); }
            };

            useEffect(() => { reloadCache(); }, []);

            // Load FAQs and categories - prioritize localStorage, fallback to JSON
            useEffect(() => {
                const loadData = async () => {
                    // Eerst checken of er data in localStorage is
                    const savedFaqs = localStorage.getItem('quinta_faqs');
                    const savedCategories = localStorage.getItem('quinta_categories');
                    const savedPending = localStorage.getItem('quinta_pending_questions');

                    let useLocalStorage = false;
                    if (savedFaqs && savedCategories) {
                        try {
                            const parsedFaqs = JSON.parse(savedFaqs);
                            if (Array.isArray(parsedFaqs) && parsedFaqs.length > 0) {
                                setFaqs(parsedFaqs);
                                setCategories(JSON.parse(savedCategories));
                                if (savedPending) {
                                    setPendingQuestions(JSON.parse(savedPending));
                                }
                                setLoading(false);
                                useLocalStorage = true;
                            }
                        } catch (e) {}
                    }
                    if (!useLocalStorage) {
                        // Eerst proberen via embedded data (werkt ook met file:// in Safari)
                        if (window.QUINTA_EMBEDDED_FAQS?.faqs?.length) {
                            const embed = window.QUINTA_EMBEDDED_FAQS;
                            setFaqs(embed.faqs);
                            setCategories(embed.categories || []);
                            localStorage.setItem('quinta_faqs', JSON.stringify(embed.faqs));
                            localStorage.setItem('quinta_categories', JSON.stringify(embed.categories || []));
                            if (savedPending) setPendingQuestions(JSON.parse(savedPending));
                            setLoading(false);
                            showMessage(`FAQs geladen uit ingebouwde data (${embed.faqs.length} stuks)`);
                        } else {
                            // Fallback: fetch (werkt op een server)
                            try {
                                const response = await fetch('faq_data.json');
                                const data = await response.json();
                                setFaqs(data.faqs);
                                setCategories(data.categories);
                                localStorage.setItem('quinta_faqs', JSON.stringify(data.faqs));
                                localStorage.setItem('quinta_categories', JSON.stringify(data.categories));
                                if (savedPending) setPendingQuestions(JSON.parse(savedPending));
                                setLoading(false);
                                showMessage('FAQs geladen uit Excel!');
                            } catch (err) {
                                console.log('faq_data.json niet gevonden en geen embedded data');
                                if (savedPending) setPendingQuestions(JSON.parse(savedPending));
                                setLoading(false);
                            }
                        }
                    }
                };

                loadData();
            }, []);

            // Save FAQs to localStorage
            useEffect(() => {
                if (faqs.length > 0) {
                    localStorage.setItem('quinta_faqs', JSON.stringify(faqs));
                }
            }, [faqs]);

            // Save categories to localStorage
            useEffect(() => {
                if (categories.length > 0) {
                    localStorage.setItem('quinta_categories', JSON.stringify(categories));
                }
            }, [categories]);

            // Save pending questions to localStorage
            useEffect(() => {
                localStorage.setItem('quinta_pending_questions', JSON.stringify(pendingQuestions));
            }, [pendingQuestions]);

            // Load AI settings on mount
            useEffect(() => {
                const saved = localStorage.getItem('quinta_ai_settings');
                if (saved) {
                    try {
                        setAiSettings(JSON.parse(saved));
                    } catch (e) {
                        console.warn('Kon AI-instellingen niet laden', e);
                    }
                }
            }, []);

            // Save AI settings whenever they change
            useEffect(() => {
                localStorage.setItem('quinta_ai_settings', JSON.stringify(aiSettings));
            }, [aiSettings]);

            const testAIConnection = async () => {
                if (!aiSettings.apiKey || !aiSettings.apiKey.startsWith('sk-ant-')) {
                    setAiTestStatus('error');
                    setAiTestMessage('Vul een geldige Claude API-sleutel in (begint met sk-ant-).');
                    return;
                }
                setAiTestStatus('testing');
                setAiTestMessage('Bezig met verbinden met Claude...');
                try {
                    const response = await fetch('https://api.anthropic.com/v1/messages', {
                        method: 'POST',
                        headers: {
                            'x-api-key': aiSettings.apiKey,
                            'anthropic-version': '2023-06-01',
                            'anthropic-dangerous-direct-browser-access': 'true',
                            'content-type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: aiSettings.model,
                            max_tokens: 50,
                            messages: [{ role: 'user', content: 'Antwoord met exact: OK' }]
                        })
                    });
                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errText.slice(0, 200)}`);
                    }
                    const data = await response.json();
                    const reply = data?.content?.[0]?.text || '(geen tekst)';
                    setAiTestStatus('success');
                    setAiTestMessage(`Verbinding gelukt! Claude antwoordde: "${reply.trim()}"`);
                } catch (err) {
                    setAiTestStatus('error');
                    setAiTestMessage(`Verbinding mislukt: ${err.message}`);
                }
            };

            const showMessage = (msg) => {
                setMessage(msg);
                setTimeout(() => setMessage(''), 3000);
            };

            const openAddModal = () => {
                setEditingId(null);
                setFormData({ category: '', question: '', answer: '' });
                setShowModal(true);
            };

            const openEditModal = (faq) => {
                setEditingId(faq.id);
                setFormData(faq);
                setShowModal(true);
            };

            // Verwijder alle cache-entries die naar een specifiek faq_id wijzen
            // (zodat verouderde antwoorden niet uit cache geserveerd worden)
            const invalidateCacheForFaq = (faqId) => {
                try {
                    const raw = localStorage.getItem('quinta_question_cache');
                    if (!raw) return 0;
                    const cache = JSON.parse(raw);
                    let removed = 0;
                    for (const lang of Object.keys(cache)) {
                        for (const q of Object.keys(cache[lang])) {
                            if (cache[lang][q].faq_id === faqId) {
                                delete cache[lang][q];
                                removed++;
                            }
                        }
                    }
                    localStorage.setItem('quinta_question_cache', JSON.stringify(cache));
                    return removed;
                } catch (e) { return 0; }
            };

            const handleSave = () => {
                if (!formData.category || !formData.question || !formData.answer) {
                    alert('Alle velden zijn verplicht');
                    return;
                }

                if (editingId) {
                    setFaqs(faqs.map(f => f.id === editingId ? { ...f, ...formData } : f));
                    const removed = invalidateCacheForFaq(editingId);
                    showMessage(removed > 0
                        ? `FAQ bijgewerkt! ${removed} cache-entries opgeschoond.`
                        : 'FAQ bijgewerkt!');
                } else {
                    const newFaq = {
                        id: Date.now(),
                        ...formData
                    };
                    setFaqs([...faqs, newFaq]);
                    showMessage('FAQ toegevoegd!');
                }

                setShowModal(false);
            };

            const handleDelete = (id) => {
                if (confirm('Zeker dat je deze FAQ wilt verwijderen?')) {
                    setFaqs(faqs.filter(f => f.id !== id));
                    const removed = invalidateCacheForFaq(id);
                    showMessage(removed > 0
                        ? `FAQ verwijderd! ${removed} cache-entries opgeschoond.`
                        : 'FAQ verwijderd!');
                }
            };

            const addCategory = () => {
                if (newCategory && !categories.includes(newCategory)) {
                    const updatedCategories = [...categories, newCategory];
                    setCategories(updatedCategories);
                    localStorage.setItem('quinta_categories', JSON.stringify(updatedCategories));
                    showMessage('Categorie toegevoegd!');
                    setNewCategory('');
                }
            };

            const removeCategory = (cat) => {
                if (confirm('Zeker dat je deze categorie wilt verwijderen? FAQs met deze categorie blijven behouden.')) {
                    const updatedCategories = categories.filter(c => c !== cat);
                    setCategories(updatedCategories);
                    localStorage.setItem('quinta_categories', JSON.stringify(updatedCategories));
                    showMessage('Categorie verwijderd!');
                }
            };

            const filteredFaqs = faqs.filter(faq => {
                const matchSearch = faq.question.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                  faq.answer.toLowerCase().includes(searchTerm.toLowerCase());
                const matchCategory = !selectedCategory || faq.category === selectedCategory;
                return matchSearch && matchCategory;
            });

            const exportToJson = () => {
                const data = JSON.stringify(faqs, null, 2);
                const element = document.createElement('a');
                element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(data));
                element.setAttribute('download', 'quinta_faqs.json');
                element.style.display = 'none';
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
                showMessage('FAQs geëxporteerd als JSON!');
            };

            const exportToCSV = () => {
                const headers = ['ID', 'Categorie', 'Vraag', 'Antwoord'];
                const rows = faqs.map(f => [f.id, f.category, `"${f.question}"`, `"${f.answer}"`]);
                const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
                const element = document.createElement('a');
                element.setAttribute('href', 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv));
                element.setAttribute('download', 'quinta_faqs.csv');
                element.style.display = 'none';
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
                showMessage('FAQs geëxporteerd als CSV!');
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const imported = JSON.parse(event.target.result);
                            if (Array.isArray(imported)) {
                                setFaqs(imported);
                                localStorage.setItem('quinta_faqs', JSON.stringify(imported));
                                showMessage('FAQs geïmporteerd!');
                            }
                        } catch (err) {
                            alert('Fout bij importeren: ' + err.message);
                        }
                    };
                    reader.readAsText(file);
                }
            };

            const answerPendingQuestion = (pendingId) => {
                const pending = pendingQuestions.find(p => p.id === pendingId);
                if (pending) {
                    setEditingPendingId(pendingId);
                    setPendingFormData({ category: '', answer: '' });
                }
            };

            const savePendingAnswer = () => {
                if (!pendingFormData.category || !pendingFormData.answer) {
                    alert('Categorie en antwoord zijn verplicht');
                    return;
                }

                const pending = pendingQuestions.find(p => p.id === editingPendingId);
                if (!pending) return;

                // Voeg toe als FAQ
                const newFaq = {
                    id: Date.now(),
                    question: pending.question,
                    answer: pendingFormData.answer,
                    category: pendingFormData.category,
                    status: 'FAQ',
                    source: 'Uit openstaande vraag'
                };

                setFaqs([...faqs, newFaq]);

                // Verwijder uit pending
                const updated = pendingQuestions.filter(p => p.id !== editingPendingId);
                setPendingQuestions(updated);
                localStorage.setItem('quinta_pending_questions', JSON.stringify(updated));

                setEditingPendingId(null);
                showMessage('Antwoord opgeslagen en FAQ aangemaakt!');
            };

            const deletePendingQuestion = (id) => {
                if (confirm('Zeker dat je deze vraag wilt verwijderen?')) {
                    const updated = pendingQuestions.filter(p => p.id !== id);
                    setPendingQuestions(updated);
                    localStorage.setItem('quinta_pending_questions', JSON.stringify(updated));
                    showMessage('Vraag verwijderd');
                }
            };

            if (loading) {
                return (
                    <div className="container">
                        <header>
                            <h1>📚 Quinta Valbom FAQ Admin</h1>
                        </header>
                        <div className="alert info">Bezig met laden van FAQs...</div>
                    </div>
                );
            }

            return (
                <div className="container">
                    <header>
                        <h1>📚 Quinta Valbom FAQ Admin</h1>
                        <p>Beheer je veelgestelde vragen eenvoudig en overzichtelijk</p>
                    </header>

                    {message && <div className="alert success">{message}</div>}

                    <div className="stats">
                        <div className="stat-card">
                            <div className="stat-number">{faqs.length}</div>
                            <div className="stat-label">FAQs in totaal</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-number">{categories.length}</div>
                            <div className="stat-label">Categorieën</div>
                        </div>
                        <div className="stat-card">
                            <div className="stat-number">{new Set(faqs.map(f => f.category)).size}</div>
                            <div className="stat-label">Gebruikte categorieën</div>
                        </div>
                    </div>

                    <div className="tabs">
                        <button
                            className={`tab-button ${activeTab === 'faqs' ? 'active' : ''}`}
                            onClick={() => setActiveTab('faqs')}
                        >
                            FAQs ({faqs.length})
                        </button>
                        <button
                            className={`tab-button ${activeTab === 'pending' ? 'active' : ''}`}
                            onClick={() => setActiveTab('pending')}
                            style={pendingQuestions.length > 0 ? { color: '#d32f2f', fontWeight: '700' } : {}}
                        >
                            🔴 Openstaande Vragen ({pendingQuestions.length})
                        </button>
                        <button
                            className={`tab-button ${activeTab === 'categories' ? 'active' : ''}`}
                            onClick={() => setActiveTab('categories')}
                        >
                            Categorieën ({categories.length})
                        </button>
                        <button
                            className={`tab-button ${activeTab === 'import' ? 'active' : ''}`}
                            onClick={() => setActiveTab('import')}
                        >
                            Import/Export
                        </button>
                        <button
                            className={`tab-button ${activeTab === 'ai' ? 'active' : ''}`}
                            onClick={() => setActiveTab('ai')}
                            style={aiSettings.enabled && aiSettings.apiKey ? { color: '#388e3c' } : {}}
                        >
                            🤖 AI Instellingen {aiSettings.enabled && aiSettings.apiKey ? '✓' : ''}
                        </button>
                        <button
                            className={`tab-button ${activeTab === 'cache' ? 'active' : ''}`}
                            onClick={() => { setActiveTab('cache'); reloadCache(); }}
                        >
                            💡 Geleerde Vragen ({Object.values(questionCache).reduce((sum, lang) => sum + Object.keys(lang).length, 0)})
                        </button>
                    </div>

                    {activeTab === 'faqs' && (
                        <div>
                            <div className="toolbar">
                                <input
                                    type="text"
                                    placeholder="Zoeken in vragen en antwoorden..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="search-input"
                                />
                                <select 
                                    value={selectedCategory}
                                    onChange={(e) => setSelectedCategory(e.target.value)}
                                >
                                    <option value="">Alle categorieën</option>
                                    {categories.map(cat => (
                                        <option key={cat} value={cat}>{cat}</option>
                                    ))}
                                </select>
                                <button onClick={openAddModal}>+ Nieuw FAQ</button>
                            </div>

                            {filteredFaqs.length === 0 ? (
                                <div className="empty-state">
                                    <p>Geen FAQs gevonden</p>
                                    <button onClick={openAddModal}>Voeg je eerste FAQ toe</button>
                                </div>
                            ) : (
                                <div className="faq-list">
                                    {filteredFaqs.map(faq => (
                                        <div key={faq.id} className="faq-card">
                                            <div className="faq-category">{faq.category}</div>
                                            <div className="faq-question">{faq.question}</div>
                                            <div className="faq-answer">{faq.answer}</div>
                                            <div className="faq-actions">
                                                <button onClick={() => openEditModal(faq)}>✏️ Bewerk</button>
                                                <button className="danger" onClick={() => handleDelete(faq.id)}>🗑️ Verwijder</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'pending' && (
                        <div>
                            {pendingQuestions.length === 0 ? (
                                <div className="empty-state">
                                    <p>✅ Geen openstaande vragen! Je bent helemaal bij!</p>
                                </div>
                            ) : (
                                <div className="faq-list">
                                    {pendingQuestions.map(pending => (
                                        <div key={pending.id} className="faq-card" style={{ borderLeft: '4px solid #d32f2f' }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '10px' }}>
                                                <div>
                                                    <div style={{ fontSize: '12px', color: '#d32f2f', fontWeight: '600', marginBottom: '5px' }}>
                                                        ⏳ OPENSTAANDE VRAAG
                                                    </div>
                                                    <div className="faq-question">{pending.question}</div>
                                                </div>
                                                <div style={{ fontSize: '12px', color: '#666' }}>
                                                    Gesteld: {new Date(pending.lastAsked).toLocaleDateString('nl-NL')}
                                                    <br/>
                                                    {pending.count}x gevraagd
                                                </div>
                                            </div>

                                            {editingPendingId === pending.id ? (
                                                <div style={{ paddingTop: '15px', borderTop: '1px solid #f0f0f0' }}>
                                                    <div className="form-group">
                                                        <label>Categorie *</label>
                                                        <select
                                                            value={pendingFormData.category}
                                                            onChange={(e) => setPendingFormData({...pendingFormData, category: e.target.value})}
                                                        >
                                                            <option value="">Selecteer categorie</option>
                                                            {categories.map(cat => (
                                                                <option key={cat} value={cat}>{cat}</option>
                                                            ))}
                                                        </select>
                                                    </div>

                                                    <div className="form-group">
                                                        <label>Antwoord *</label>
                                                        <textarea
                                                            value={pendingFormData.answer}
                                                            onChange={(e) => setPendingFormData({...pendingFormData, answer: e.target.value})}
                                                            placeholder="Geef een duidelijk antwoord..."
                                                            style={{
                                                                width: '100%',
                                                                padding: '10px 15px',
                                                                border: '1px solid #ddd',
                                                                borderRadius: '6px',
                                                                fontFamily: 'inherit',
                                                                minHeight: '120px'
                                                            }}
                                                        />
                                                    </div>

                                                    <div style={{ display: 'flex', gap: '10px', paddingTop: '15px' }}>
                                                        <button
                                                            className="success"
                                                            onClick={savePendingAnswer}
                                                        >
                                                            ✅ Als FAQ Opslaan
                                                        </button>
                                                        <button
                                                            className="secondary"
                                                            onClick={() => setEditingPendingId(null)}
                                                        >
                                                            Annuleren
                                                        </button>
                                                    </div>
                                                </div>
                                            ) : (
                                                <div className="faq-actions">
                                                    <button className="success" onClick={() => answerPendingQuestion(pending.id)}>
                                                        ✏️ Antwoord Geven
                                                    </button>
                                                    <button className="danger" onClick={() => deletePendingQuestion(pending.id)}>
                                                        🗑️ Verwijderen
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {activeTab === 'categories' && (
                        <div>
                            <div style={{ marginBottom: '20px' }}>
                                <div className="form-group" style={{ marginBottom: '15px' }}>
                                    <label>Nieuwe categorie toevoegen:</label>
                                    <div style={{ display: 'flex', gap: '10px' }}>
                                        <input
                                            type="text"
                                            value={newCategory}
                                            onChange={(e) => setNewCategory(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && addCategory()}
                                            placeholder="Bijv. Eten & Drinken"
                                            style={{ flex: 1 }}
                                        />
                                        <button onClick={addCategory}>Toevoegen</button>
                                    </div>
                                </div>

                                {categories.length === 0 ? (
                                    <div className="empty-state">
                                        <p>Nog geen categorieën. Voeg er een toe hierboven!</p>
                                    </div>
                                ) : (
                                    <div>
                                        <h3 style={{ marginBottom: '15px', fontSize: '16px', fontWeight: '600' }}>Bestaande categorieën:</h3>
                                        <div className="category-list">
                                            {categories.map(cat => (
                                                <div key={cat} className="category-badge">
                                                    {cat}
                                                    <button onClick={() => removeCategory(cat)}>×</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {activeTab === 'import' && (
                        <div>
                            <div className="form-group" style={{ marginBottom: '30px' }}>
                                <h3 style={{ marginBottom: '15px', fontSize: '16px', fontWeight: '600' }}>Gegevens exporteren:</h3>
                                <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                                    <button className="success" onClick={exportToJson}>📥 Exporteer als JSON</button>
                                    <button className="success" onClick={exportToCSV}>📥 Exporteer als CSV</button>
                                </div>
                            </div>

                            <div className="form-group">
                                <h3 style={{ marginBottom: '15px', fontSize: '16px', fontWeight: '600' }}>Gegevens importeren:</h3>
                                <label style={{ display: 'block', marginBottom: '10px' }}>JSON bestand importeren:</label>
                                <div className="file-input-wrapper">
                                    <button className="secondary">Kies JSON bestand</button>
                                    <input 
                                        type="file" 
                                        accept=".json"
                                        onChange={handleImportJSON}
                                    />
                                </div>
                                <p style={{ fontSize: '12px', color: '#999', marginTop: '10px' }}>
                                    Dit vervangt alle huidige FAQs. Zorg dat je eerst een backup hebt!
                                </p>
                            </div>
                        </div>
                    )}

                    {activeTab === 'cache' && (() => {
                        const langNames = { nl: '🇳🇱 Nederlands', en: '🇬🇧 English', pt: '🇵🇹 Português', de: '🇩🇪 Deutsch', fr: '🇫🇷 Français' };

                        // Flatten alle entries
                        const allEntries = [];
                        for (const [lang, entries] of Object.entries(questionCache)) {
                            for (const [normalizedQ, data] of Object.entries(entries)) {
                                allEntries.push({ language: lang, normalizedQ, ...data });
                            }
                        }

                        // Filter op taal
                        const filtered = cacheLanguageFilter === 'all'
                            ? allEntries
                            : allEntries.filter(e => e.language === cacheLanguageFilter);

                        // Sorteer op meest gebruikt
                        filtered.sort((a, b) => (b.hits || 0) - (a.hits || 0));

                        const availableLangs = [...new Set(allEntries.map(e => e.language))];

                        const deleteEntry = (lang, normQ) => {
                            const cache = { ...questionCache };
                            if (cache[lang]) {
                                delete cache[lang][normQ];
                                if (Object.keys(cache[lang]).length === 0) delete cache[lang];
                            }
                            localStorage.setItem('quinta_question_cache', JSON.stringify(cache));
                            setQuestionCache(cache);
                            showMessage('Cache-entry verwijderd');
                        };

                        const clearCache = (lang) => {
                            const msg = lang === 'all'
                                ? 'Weet je zeker dat je ALLE geleerde vragen wilt wissen?'
                                : `Weet je zeker dat je alle vragen in ${langNames[lang] || lang} wilt wissen?`;
                            if (!confirm(msg)) return;
                            const cache = { ...questionCache };
                            if (lang === 'all') {
                                localStorage.setItem('quinta_question_cache', JSON.stringify({}));
                                setQuestionCache({});
                            } else {
                                delete cache[lang];
                                localStorage.setItem('quinta_question_cache', JSON.stringify(cache));
                                setQuestionCache(cache);
                            }
                            showMessage('Cache geleegd');
                        };

                        const totalHits = allEntries.reduce((sum, e) => sum + (e.hits || 0), 0);

                        return (
                            <div>
                                <div className="alert info" style={{ marginBottom: '20px' }}>
                                    <strong>💡 Wat is dit?</strong> Vragen die de chatbot eerder heeft beantwoord worden hier opgeslagen
                                    (per taal). Bij dezelfde of bijna-identieke vraag (90% match) wordt het antwoord direct uit cache geserveerd
                                    — geen AI-call nodig. Antwoorden komen altijd live uit de actuele FAQ-tekst.
                                </div>

                                <div className="stats">
                                    <div className="stat-card">
                                        <div className="stat-number">{allEntries.length}</div>
                                        <div className="stat-label">Geleerde vragen</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{totalHits}</div>
                                        <div className="stat-label">Cache-hits totaal</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-number">{availableLangs.length}</div>
                                        <div className="stat-label">Talen</div>
                                    </div>
                                </div>

                                <div className="toolbar">
                                    <select
                                        value={cacheLanguageFilter}
                                        onChange={(e) => setCacheLanguageFilter(e.target.value)}
                                    >
                                        <option value="all">Alle talen</option>
                                        {availableLangs.map(lang => (
                                            <option key={lang} value={lang}>{langNames[lang] || lang}</option>
                                        ))}
                                    </select>
                                    <button onClick={reloadCache} className="secondary">🔄 Vernieuwen</button>
                                    <button
                                        onClick={() => clearCache(cacheLanguageFilter)}
                                        className="danger"
                                        disabled={filtered.length === 0}
                                    >
                                        🗑️ {cacheLanguageFilter === 'all' ? 'Alles wissen' : `${langNames[cacheLanguageFilter] || cacheLanguageFilter} wissen`}
                                    </button>
                                </div>

                                {filtered.length === 0 ? (
                                    <div className="empty-state">
                                        <p>Nog geen geleerde vragen. De cache wordt opgebouwd zodra gasten vragen stellen.</p>
                                    </div>
                                ) : (
                                    <div className="faq-list">
                                        {filtered.map(entry => {
                                            const linkedFaq = faqs.find(f => f.id === entry.faq_id);
                                            return (
                                                <div key={`${entry.language}-${entry.normalizedQ}`} className="faq-card" style={{ borderLeft: '4px solid #4caf50' }}>
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '10px' }}>
                                                        <div style={{ flex: 1 }}>
                                                            <div style={{ display: 'flex', gap: '8px', alignItems: 'center', marginBottom: '8px' }}>
                                                                <span style={{ fontSize: '12px', background: '#E8F5E9', color: '#2E7D32', padding: '3px 10px', borderRadius: '12px', fontWeight: '600' }}>
                                                                    {langNames[entry.language] || entry.language}
                                                                </span>
                                                                <span style={{ fontSize: '12px', color: '#666' }}>
                                                                    {entry.hits || 0}× gebruikt
                                                                </span>
                                                                {linkedFaq ? (
                                                                    <span style={{ fontSize: '12px', color: '#4472C4' }}>
                                                                        → {linkedFaq.category}
                                                                    </span>
                                                                ) : (
                                                                    <span style={{ fontSize: '12px', color: '#d32f2f' }}>
                                                                        ⚠️ FAQ niet meer beschikbaar
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <div className="faq-question" style={{ fontSize: '15px' }}>
                                                                "{entry.originalQuestion || entry.normalizedQ}"
                                                            </div>
                                                            <div className="faq-answer" style={{ marginTop: '8px', fontSize: '13px', color: '#666', fontStyle: 'italic' }}>
                                                                Antwoord: {entry.answer ? entry.answer.slice(0, 200) + (entry.answer.length > 200 ? '...' : '') : '(geen)'}
                                                            </div>
                                                        </div>
                                                        <div style={{ fontSize: '11px', color: '#999', textAlign: 'right', marginLeft: '15px', minWidth: '120px' }}>
                                                            Laatst: {new Date(entry.lastUsed).toLocaleDateString('nl-NL')}
                                                            <br/>
                                                            Sinds: {new Date(entry.firstSeen).toLocaleDateString('nl-NL')}
                                                        </div>
                                                    </div>
                                                    <div className="faq-actions">
                                                        <button className="danger" onClick={() => deleteEntry(entry.language, entry.normalizedQ)}>
                                                            🗑️ Verwijder uit cache
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        );
                    })()}

                    {activeTab === 'ai' && (
                        <div>
                            <div className="alert info" style={{ marginBottom: '20px' }}>
                                <strong>🤖 Claude AI verbetert antwoorden enorm.</strong> Met een API-sleutel kan de bot vragen écht begrijpen,
                                synoniemen herkennen, context volgen en natuurlijke antwoorden formuleren — in plaats van alleen woorden te matchen.
                                <br/><br/>
                                <strong style={{ color: '#d32f2f' }}>⚠️ Let op:</strong> in deze browser-only opzet is de API-sleutel zichtbaar voor wie de chat-pagina opent.
                                Voor productie raden we aan om dit via een backend (zoals Supabase Edge Functions) te laten lopen.
                            </div>

                            <div className="form-group">
                                <label>Claude AI inschakelen</label>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', fontWeight: 'normal' }}>
                                        <input
                                            type="checkbox"
                                            checked={aiSettings.enabled}
                                            onChange={(e) => setAiSettings({...aiSettings, enabled: e.target.checked})}
                                            style={{ width: '18px', height: '18px' }}
                                        />
                                        Gebruik Claude voor het beantwoorden van vragen
                                    </label>
                                </div>
                                <p style={{ fontSize: '12px', color: '#999', marginTop: '6px' }}>
                                    Als uitgeschakeld, gebruikt de chat alleen het lokale woord-matching algoritme.
                                </p>
                            </div>

                            <div className="form-group">
                                <label>Claude API-sleutel *</label>
                                <div style={{ display: 'flex', gap: '8px' }}>
                                    <input
                                        type={showApiKey ? 'text' : 'password'}
                                        value={aiSettings.apiKey}
                                        onChange={(e) => setAiSettings({...aiSettings, apiKey: e.target.value.trim()})}
                                        placeholder="sk-ant-api03-..."
                                        style={{ flex: 1 }}
                                        autoComplete="off"
                                    />
                                    <button
                                        type="button"
                                        className="secondary"
                                        onClick={() => setShowApiKey(!showApiKey)}
                                        style={{ padding: '10px 14px' }}
                                    >
                                        {showApiKey ? '🙈 Verberg' : '👁️ Toon'}
                                    </button>
                                </div>
                                <p style={{ fontSize: '12px', color: '#999', marginTop: '6px' }}>
                                    Maak er een aan op <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer" style={{ color: '#4472C4' }}>console.anthropic.com</a>.
                                    Wordt opgeslagen in jouw browser (localStorage).
                                </p>
                            </div>

                            <div className="form-group">
                                <label>Model</label>
                                <select
                                    value={aiSettings.model}
                                    onChange={(e) => setAiSettings({...aiSettings, model: e.target.value})}
                                >
                                    <option value="claude-haiku-4-5">Claude Haiku 4.5 — snel & goedkoop (aanbevolen)</option>
                                    <option value="claude-sonnet-4-6">Claude Sonnet 4.6 — slimmer maar duurder</option>
                                    <option value="claude-opus-4-6">Claude Opus 4.6 — zwaarste model</option>
                                </select>
                                <p style={{ fontSize: '12px', color: '#999', marginTop: '6px' }}>
                                    Voor 29 FAQs is Haiku ruim voldoende. Geschatte kosten: minder dan €0,001 per vraag.
                                </p>
                            </div>

                            <div className="form-group">
                                <label>Creativiteit (temperature): {aiSettings.temperature}</label>
                                <input
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.1"
                                    value={aiSettings.temperature}
                                    onChange={(e) => setAiSettings({...aiSettings, temperature: parseFloat(e.target.value)})}
                                    style={{ width: '100%' }}
                                />
                                <p style={{ fontSize: '12px', color: '#999', marginTop: '6px' }}>
                                    Lager = strakker bij FAQ-tekst, hoger = vrijer geformuleerd. 0.3 is een goede start.
                                </p>
                            </div>

                            <div className="form-group" style={{ marginTop: '25px', padding: '15px', background: '#fff8e1', borderRadius: '6px', borderLeft: '4px solid #f9a825' }}>
                                <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer', fontWeight: '600' }}>
                                    <input
                                        type="checkbox"
                                        checked={!!aiSettings.debug}
                                        onChange={(e) => setAiSettings({...aiSettings, debug: e.target.checked})}
                                        style={{ width: '18px', height: '18px' }}
                                    />
                                    🐛 Debug-modus inschakelen
                                </label>
                                <p style={{ fontSize: '12px', color: '#5d4037', marginTop: '6px', marginLeft: '26px' }}>
                                    Toont onder elk antwoord in de chat welke laag is gebruikt (cache / Claude / lokaal),
                                    welk faq_id, en eventuele fouten. Handig om te zien waarom een vraag escaleert.
                                    Vergeet niet uit te zetten voordat je de chat aan gasten laat zien!
                                </p>
                            </div>

                            <div style={{ display: 'flex', gap: '10px', marginTop: '20px' }}>
                                <button
                                    className="success"
                                    onClick={testAIConnection}
                                    disabled={aiTestStatus === 'testing' || !aiSettings.apiKey}
                                >
                                    {aiTestStatus === 'testing' ? '⏳ Bezig...' : '🧪 Test verbinding'}
                                </button>
                            </div>

                            {aiTestStatus && (
                                <div
                                    className={`alert ${aiTestStatus === 'success' ? 'success' : 'info'}`}
                                    style={{
                                        marginTop: '15px',
                                        background: aiTestStatus === 'error' ? '#FFEBEE' : undefined,
                                        color: aiTestStatus === 'error' ? '#C62828' : undefined,
                                        border: aiTestStatus === 'error' ? '1px solid #FFCDD2' : undefined
                                    }}
                                >
                                    {aiTestMessage}
                                </div>
                            )}

                            <div style={{ marginTop: '30px', padding: '20px', background: '#f9f9f9', borderRadius: '8px', borderLeft: '4px solid #4472C4' }}>
                                <h3 style={{ marginBottom: '10px', fontSize: '15px' }}>Hoe werkt het precies?</h3>
                                <ol style={{ paddingLeft: '20px', fontSize: '13px', color: '#555', lineHeight: '1.7' }}>
                                    <li>Gast stelt vraag in de chat</li>
                                    <li>Chat stuurt vraag + alle FAQs naar Claude</li>
                                    <li>Claude zoekt de beste FAQ en formuleert een natuurlijk antwoord</li>
                                    <li>Als geen enkele FAQ past, escaleert Claude automatisch naar Openstaande Vragen</li>
                                    <li>Bij een API-fout valt het systeem terug op lokaal woord-matching</li>
                                </ol>
                            </div>
                        </div>
                    )}

                    {showModal && (
                        <div className="modal">
                            <div className="modal-content">
                                <h2>{editingId ? 'FAQ Bewerken' : 'Nieuw FAQ'}</h2>
                                
                                <div className="form-group">
                                    <label>Categorie *</label>
                                    <select
                                        value={formData.category}
                                        onChange={(e) => setFormData({...formData, category: e.target.value})}
                                    >
                                        <option value="">Selecteer categorie</option>
                                        {categories.map(cat => (
                                            <option key={cat} value={cat}>{cat}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="form-group">
                                    <label>Vraag *</label>
                                    <input
                                        type="text"
                                        value={formData.question}
                                        onChange={(e) => setFormData({...formData, question: e.target.value})}
                                        placeholder="Bijv. Wat zijn de uren van de bar?"
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Antwoord *</label>
                                    <textarea
                                        value={formData.answer}
                                        onChange={(e) => setFormData({...formData, answer: e.target.value})}
                                        placeholder="Geef een duidelijk en volledig antwoord..."
                                    />
                                </div>

                                <div className="form-actions">
                                    <button className="secondary" onClick={() => setShowModal(false)}>Annuleren</button>
                                    <button onClick={handleSave}>Opslaan</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<FAQAdmin />, document.getElementById('root'));
    </script>
</body>
</html>
