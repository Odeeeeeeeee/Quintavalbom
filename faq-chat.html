    <title>Quinta Valbom Chat</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4472C4 0%, #2E5C8A 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }

        .chat-header {
            background: linear-gradient(135deg, #4472C4 0%, #2E5C8A 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-in;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.bot .message-content {
            background: #f0f0f0;
            color: #333;
            border-radius: 12px 12px 12px 0;
        }

        .message.user .message-content {
            background: #4472C4;
            color: white;
            border-radius: 12px 12px 0 12px;
        }

        .message-meta {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .message.bot .message-meta {
            text-align: left;
        }

        .message.user .message-meta {
            text-align: right;
        }

        .faq-source {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
            font-style: italic;
        }

        .confidence {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
            }
            30% {
                opacity: 1;
            }
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #4472C4;
        }

        button {
            padding: 12px 24px;
            background: #4472C4;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #2E5C8A;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .empty-state p {
            font-size: 13px;
            margin-bottom: 15px;
        }

        .suggestion-button {
            display: inline-block;
            padding: 8px 16px;
            background: #E8F1F8;
            color: #4472C4;
            border: 1px solid #4472C4;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.2s;
        }

        .suggestion-button:hover {
            background: #4472C4;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .not-found {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 4px;
        }

        .feedback-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }

        .feedback-btn {
            padding: 8px 12px;
            font-size: 12px;
            background: #f0f0f0;
            color: #666;
            border: 1px solid #ddd;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .feedback-btn:hover {
            background: #e0e0e0;
            color: #333;
        }

        .feedback-btn.helpful {
            background: #E8F5E9;
            color: #2E7D32;
            border-color: #C8E6C9;
        }

        .feedback-btn.helpful:hover {
            background: #C8E6C9;
        }

        .feedback-btn.unhelpful {
            background: #FFEBEE;
            color: #C62828;
            border-color: #FFCDD2;
        }

        .feedback-btn.unhelpful:hover {
            background: #FFCDD2;
        }

        .feedback-message {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            font-style: italic;
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .ai-badge.claude {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .ai-badge.local {
            background: #FFF3E0;
            color: #E65100;
        }

        .header-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 11px;
            opacity: 0.85;
            margin-top: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.online {
            background: #4caf50;
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.6);
        }

        .status-dot.offline {
            background: #ff9800;
        }
    </style>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Synchrone initiële FAQ-load: vermijdt race condition waarbij user
        // typt voordat React's useEffect klaar is met setFaqs.
        const initialFaqs = (() => {
            try {
                const saved = localStorage.getItem('quinta_faqs');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        console.log('[QuintaBot] Init: FAQs uit localStorage:', parsed.length);
                        return parsed;
                    }
                }
            } catch (e) {}
            if (window.QUINTA_EMBEDDED_FAQS?.faqs?.length) {
                console.log('[QuintaBot] Init: FAQs uit embedded data:', window.QUINTA_EMBEDDED_FAQS.faqs.length);
                // Direct ook naar localStorage zodat het persistent is
                try { localStorage.setItem('quinta_faqs', JSON.stringify(window.QUINTA_EMBEDDED_FAQS.faqs)); } catch (e) {}
                return window.QUINTA_EMBEDDED_FAQS.faqs;
            }
            console.warn('[QuintaBot] Init: GEEN FAQs beschikbaar!');
            return [];
        })();

        const ChatApp = () => {
            // Welkomstbericht direct zetten als FAQs al beschikbaar zijn

            const [input, setInput] = useState('');

            const [typing, setTyping] = useState(false);
            const [feedbackMessage, setFeedbackMessage] = useState(null);
            const [aiSettings, setAiSettings] = useState({ enabled: false, apiKey: '', model: 'claude-haiku-4-5', temperature: 0.5, debug: false });
            const [sessionLanguage, setSessionLanguage] = useState(null); // wordt gezet op eerste user-bericht
            const messagesEndRef = useRef(null);

            // Welkomstberichten + fallback-zinnen per taal
            const I18N = {
                nl: {
                    welcome: 'Hallo! 👋 Ik ben de Quinta Valbom chatbot. Hoe kan ik je helpen? Stel je vragen over onze camping!',

                    send: 'Verzenden',
                    notFoundClaude: 'Daar heb ik helaas geen antwoord op. Ik heb je vraag doorgestuurd naar Moniek of Thomas — zij komen er bij je op terug. Of bel/app gerust direct: +351 910 348 399.',

                    feedbackThanksPos: 'Dank je wel voor je positieve feedback!',
                    feedbackThanksNeg: 'Dank je wel voor je negatieve feedback!',
                    helpful: '👍 Nuttig',
                    unhelpful: '👎 Niet nuttig',
                    category: 'Categorie'
                },
                en: {
                    welcome: 'Hi! 👋 I\'m the Quinta Valbom chatbot. How can I help? Ask me anything about our campsite!',
                    placeholder: 'Type your question...',
                    send: 'Send',
                    notFoundClaude: 'I don\'t have an answer for that. I\'ve forwarded your question to Moniek or Thomas — they\'ll get back to you. For something urgent, call/WhatsApp +351 910 348 399.',

                    for (const [concept, synonyms] of Object.entries(synonymsMap)) {
                        const allTerms = [concept, ...synonyms];
                        if (allTerms.some(term => term === t || (term.length > 3 && t.includes(term)) || (t.length > 3 && term.includes(t)))) {
                            expanded.add(concept);
                            synonyms.forEach(s => expanded.add(s));
                        }
                    }
                });
                return expanded;
            };

            // Bouw IDF: woorden die in veel FAQs voorkomen wegen minder zwaar
            // (bv. "open", "tot", "uur" matchen overal en discrimineren niet).
            let _idfCache = null;
            const buildIdf = (faqList) => {
                const docFreq = {};
                const N = faqList.length;
                faqList.forEach(faq => {
                    const tokens = new Set(tokenize(`${faq.question} ${faq.context || ''}`));
                    tokens.forEach(t => { docFreq[t] = (docFreq[t] || 0) + 1; });
                });
                const idf = {};
                for (const [t, df] of Object.entries(docFreq)) {
                    idf[t] = Math.log((N + 1) / (df + 1)) + 1;
                }
                return idf;
            };

            const getIdf = () => {
                if (!_idfCache && faqs.length > 0) {
                    _idfCache = buildIdf(faqs);
                }
                return _idfCache || {};
            };

            // Genereer alle relevante zoek-tokens (origineel + synoniem-varianten) per query token
            const tokenWithSynonyms = (token) => {
                const variants = new Set([token]);
                for (const [concept, synonyms] of Object.entries(synonymsMap)) {
                    const allTerms = [concept, ...synonyms];
                    if (allTerms.some(term => term === token)) {
                        variants.add(concept);
                        synonyms.forEach(s => variants.add(s));
                    }
                }
                return variants;
            };

            // Match een query token tegen een veld; geeft beste match-score (0-1)
            const findInField = (queryToken, fieldTokens) => {
                const variants = tokenWithSynonyms(queryToken);
                let best = 0;
                for (const v of variants) {
                    if (fieldTokens.has(v)) {
                        best = Math.max(best, v === queryToken ? 1.0 : 0.85);
                    }
                }
                if (best === 1.0) return best;
                // Fuzzy fallback alleen op originele token (typo-tolerantie)
                for (const ft of fieldTokens) {
                    const s = fuzzyMatch(queryToken, ft);
                    if (s > best) best = s;
                }
                return best;
            };

            const scoreMatch = (questionTokens, faq, idf) => {
                if (questionTokens.length === 0) return 0;

                const qTokensSet = new Set(tokenize(faq.question));
                const cTokensSet = new Set(tokenize(faq.context || ''));
                const aTokensSet = new Set(tokenize(faq.answer));
                const catTokensSet = new Set(tokenize(faq.category || ''));

                // Gewichten: vraag-tekst van FAQ telt 4x (sterk), categorie 2x,
                // context 1.2x (lager om "niet over X" false positives te dempen),
                // antwoord 1x.
                const FIELD_WEIGHTS = { q: 4.0, c: 1.2, cat: 2.0, a: 1.0 };

                let totalScore = 0;
                let totalIdf = 0;

                questionTokens.forEach(qt => {
                    const tokenIdf = idf[qt] || 1.5;
                    totalIdf += tokenIdf;

                    const qScore = findInField(qt, qTokensSet);
                    const cScore = findInField(qt, cTokensSet);
                    const catScore = findInField(qt, catTokensSet);
                    const aScore = findInField(qt, aTokensSet);

                    // Beste veld-match bepalen, vermenigvuldigd met veld-gewicht
                    const fieldHit = Math.max(
                        qScore * FIELD_WEIGHTS.q,
                        cScore * FIELD_WEIGHTS.c,
                        catScore * FIELD_WEIGHTS.cat,
                        aScore * FIELD_WEIGHTS.a
                    );

                    totalScore += (fieldHit / FIELD_WEIGHTS.q) * tokenIdf;
                });

                return totalIdf > 0 ? totalScore / totalIdf : 0;
            };

            const findRelevantFAQ = (question) => {
                console.log('[BOT] findRelevantFAQ START — faqs lengte:', faqs?.length ?? 'undefined');
                if (!faqs || faqs.length === 0) {
                    console.log('%c[BOT] ⚠️ GEEN FAQs geladen!', 'color: red; font-weight: bold', 'faqs =', faqs);
                    return null;
                }
                const qTokens = tokenize(question);
                console.log('[BOT] Tokens na normalisatie:', qTokens);
                if (qTokens.length === 0) {
                    console.log('%c[BOT] ⚠️ Geen bruikbare tokens', 'color: orange');
                    return null;
                }

                const idf = getIdf();

                const scored = faqs.map(faq => ({ faq, score: scoreMatch(qTokens, faq, idf) }));
                scored.sort((a, b) => b.score - a.score);

                console.log('[BOT] Aantal FAQs gescoord:', faqs.length);
                console.log('[BOT] Top 3:', scored.slice(0, 3).map(s => `${(s.score*100).toFixed(0)}% — ${s.faq.category}: "${s.faq.question}"`));

                const bestMatch = scored[0];
                const bestScore = bestMatch.score;
                const runnerUp = scored[1]?.score || 0;

                if (bestScore >= 0.30) {
                    const margin = bestScore - runnerUp;
                    const lowConfidence = bestScore < 0.55 || margin < 0.08;
                    return { ...bestMatch, lowConfidence };
                }
                console.log('[BOT] Beste score', (bestScore*100).toFixed(0)+'%', 'haalt drempel 30% niet → geen match');
                return null;
            };

            const handleSend = async () => {
                if (!input.trim()) return;

                console.log('%c[BOT] === Nieuwe vraag ===', 'color: #4472C4; font-weight: bold');
                console.log('[BOT] Vraag:', input);

                const userMessage = {
                    id: Date.now(),
                    type: 'user',
                    text: input,
                    timestamp: new Date()
                };

                setMessages(prev => [...prev, userMessage]);
                setInput('');
                setTyping(true);

                const userQuestion = input;

                // Bepaal taal: lock op de eerste vraag van de gebruiker.
                let language = sessionLanguage;
                if (!language) {
                    language = detectLanguage(userQuestion);
                    setSessionLanguage(language);
                }
                console.log('[BOT] Taal:', language);

                const claudeAvailable = aiSettings.enabled && aiSettings.apiKey && aiSettings.apiKey.startsWith('sk-ant-');
                console.log('[BOT] Claude beschikbaar?', claudeAvailable, '(enabled:', aiSettings.enabled, ', heeft sleutel:', !!aiSettings.apiKey, ')');

                let botMessage = null;
                let debugInfo = { language, claudeAvailable, layers: [] };

                // ===== LAAG 1: Cache lookup =====
                console.log('[BOT] LAAG 1: Cache opzoeken...');
                const cacheHit = lookupCache(userQuestion, language);
                if (cacheHit && cacheHit.answer) {
                    console.log('%c[BOT] ✅ Cache HIT', 'color: green', cacheHit);
                    debugInfo.layers.push({ layer: 'cache', result: 'hit', ...cacheHit });
                    const cachedFaq = faqs.find(f => f.id === cacheHit.faq_id);
                    bumpCacheHit(language, cacheHit.normalizedQ);
                    botMessage = {
                        id: Date.now() + 1,
                        type: 'bot',
                        text: cacheHit.answer,
                        faq: cachedFaq || null,
                        source: 'cache',
                        language,
                        cacheKey: cacheHit.normalizedQ,
                        userQuestion,
                        timestamp: new Date()
                    };
                }

                if (!cacheHit) {
                    console.log('[BOT] Cache miss');
                    debugInfo.layers.push({ layer: 'cache', result: 'miss' });
                }

                // ===== LAAG 2: Claude API =====
                let claudeSaidNoMatch = false;
                if (!botMessage && claudeAvailable) {
                    console.log('[BOT] LAAG 2: Claude API aanroepen...');
                    try {
                        const result = await askClaude(userQuestion, faqs, aiSettings, language);
                        console.log('[BOT] Claude raw resultaat:', result);
                        debugInfo.layers.push({ layer: 'claude', result: result.matched ? 'matched' : 'no-match', ...result });
                        if (result.matched) {
                            const matchedFaq = result.faq_id ? faqs.find(f => f.id === result.faq_id) : null;

                            // Schrijf naar cache (alleen als we een echte faq_id hebben)
                            if (result.faq_id && matchedFaq && result.answer) {
                                writeCache(userQuestion, language, result.faq_id, result.answer);
                            }

                            botMessage = {
                                id: Date.now() + 1,
                                type: 'bot',
                                text: result.answer,
                                faq: matchedFaq || (result.category ? { category: result.category } : null),
                                source: 'claude',
                                language,
                                userQuestion,
                                timestamp: new Date()
                            };
                        } else {
                            // Claude zegt geen match — markeer maar geef lokale algoritme nog een kans
                            claudeSaidNoMatch = true;
                            console.log('%c[BOT] ⚠️ Claude zei matched:false', 'color: orange');
                        }
                    } catch (err) {
                        console.error('%c[BOT] ❌ Claude API faalde:', 'color: red', err.message);
                        debugInfo.layers.push({ layer: 'claude', result: 'error', error: err.message });
                    }
                } else if (!botMessage && !claudeAvailable) {
                    console.log('[BOT] LAAG 2 overgeslagen: Claude is niet ingeschakeld of geen sleutel');
                }

                // ===== LAAG 3: Lokaal algoritme (fallback) =====
                if (!botMessage) {
                    const skipLocal = claudeSaidNoMatch && language !== 'nl';
                    console.log('[BOT] LAAG 3: Lokaal algoritme', skipLocal ? '(overgeslagen vanwege non-NL na Claude-no-match)' : 'proberen...');

                    if (!skipLocal) {
                        const match = findRelevantFAQ(userQuestion);
                        console.log('[BOT] Lokaal resultaat:', match ? `score ${(match.score*100).toFixed(0)}% op "${match.faq.question}"` : 'geen match');
                        debugInfo.layers.push({ layer: 'local', result: match ? 'match' : 'no-match', match });
                        if (match) {
                            let answerText = match.faq.answer;
                            if (match.lowConfidence) {
                                answerText = `${t('lowConfPrefix', language)}\n\n${match.faq.answer}\n\n${t('lowConfSuffix', language)}`;
                            }
                            botMessage = {
                                id: Date.now() + 1,
                                type: 'bot',
                                text: answerText,
                                faq: match.faq,
                                source: 'local',
                                language,
                                lowConfidence: match.lowConfidence,
                                userQuestion,
                                timestamp: new Date()
                            };
                        }
                    }

                    // Als nog steeds niets gevonden: escaleer
                    if (!botMessage) {
                        console.log('%c[BOT] ❌ Niets gevonden — escaleren', 'color: red');
                        savePendingQuestion(userQuestion);
                        botMessage = {
                            id: Date.now() + 1,
                            type: 'bot',
                            text: claudeSaidNoMatch ? t('notFoundClaude', language) : t('notFoundLocal', language),
                            notFound: true,
                            source: 'local',
                            language,
                            userQuestion,
                            timestamp: new Date()
                        };
                    }
                }

                botMessage.debugInfo = debugInfo;
                console.log('[BOT] === Klaar ===', botMessage.source);
                setMessages(prev => [...prev, botMessage]);
                setTyping(false);
            };

            const suggestedQuestions = [
                'Wat zijn de openingstijden van de bar?',
                'Hoe laat is het zwembad open?',
                'Hoe kan ik contact opnemen?',
                'Wat zijn de regels op de camping?'
            ];

            if (loading) {
                return (
                    <div className="chat-container">
                        <div className="chat-header">
                            <h1>Quinta Valbom Chat</h1>
                        </div>
                        <div className="loading">Bezig met laden...</div>
                    </div>
                );
            }

            return (
                <div className="chat-container">
                    <div className="chat-header">
                        <h1>🏕️ Quinta Valbom Chat</h1>
                        <p>Stel je vragen over onze camping</p>
                    </div>

                    <div className="chat-messages">
                        {messages.length === 1 && (
                            <div className="empty-state">
                                <h3>Welkom! 👋</h3>
                                <p>Stel een vraag over de camping</p>
                                <div>
                                    {suggestedQuestions.map((q, i) => (
                                        <button
                                            key={i}
                                            className="suggestion-button"
                                            onClick={() => {
                                                setInput(q);
                                            }}
                                        >
                                            {q}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {messages.map((msg) => (
                            <div key={msg.id} className={`message ${msg.type}`}>
                                <div>
                                    <div className="message-content">
                                        {msg.text.split('\n').map((line, i) => (
                                            <React.Fragment key={i}>
                                                {line}
                                                {i < msg.text.split('\n').length - 1 && <br/>}
                                            </React.Fragment>
                                        ))}
                                        {msg.faq && msg.faq.category && (
                                            <div className="faq-source">
                                                {t('category', msg.language)}: <strong>{msg.faq.category}</strong>
                                            </div>
                                        )}
                                        {aiSettings.debug && msg.type === 'bot' && msg.debugInfo && (
                                            <div style={{ marginTop: '10px', padding: '8px 10px', background: '#fff8e1', border: '1px dashed #f9a825', borderRadius: '6px', fontSize: '11px', fontFamily: 'monospace', color: '#5d4037' }}>
                                                <div><strong>🐛 Debug</strong> — bron: <strong>{msg.source}</strong> · taal: {msg.debugInfo.language} · Claude: {msg.debugInfo.claudeAvailable ? 'aan' : 'uit'}</div>
                                                {msg.debugInfo.layers.map((l, i) => (
                                                    <div key={i} style={{ marginTop: '4px' }}>
                                                        Laag {i+1} ({l.layer}): <strong>{l.result}</strong>
                                                        {l.faq_id && ` → faq #${l.faq_id}`}
                                                        {l.match && ` → "${l.match.faq.question}" (${(l.match.score*100).toFixed(0)}%)`}
                                                        {l.error && ` → ${l.error}`}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {msg.notFound && (
                                            <div className="not-found">
                                                ⚠️ Geen relevant antwoord gevonden
                                            </div>
                                        )}

                                        {msg.type === 'bot' && (
                                            <div className="feedback-buttons">
                                                <button
                                                    className="feedback-btn helpful"
                                                    onClick={() => markFeedback(msg.id, true)}
                                                >
                                                    {t('helpful', msg.language)}
                                                </button>
                                                <button
                                                    className="feedback-btn unhelpful"
                                                    onClick={() => markFeedback(msg.id, false)}
                                                >
                                                    {t('unhelpful', msg.language)}
                                                </button>
                                            </div>
                                        )}
                                    </div>
                                    <div className="message-meta">
                                        {msg.timestamp.toLocaleTimeString('nl-NL', {
                                            hour: '2-digit',
                                            minute: '2-digit'
                                        })}
                                    </div>
                                </div>
                            </div>
                        ))}

                        {typing && (
                            <div className="message bot">
                                <div className="typing-indicator">
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                    <div className="typing-dot"></div>
                                </div>
                            </div>
                        )}

                        {feedbackMessage && (
                            <div style={{ textAlign: 'center', padding: '10px', color: '#4472C4', fontSize: '13px' }}>
                                {feedbackMessage}
                            </div>
                        )}

                        <div ref={messagesEndRef} />
                    </div>

                    <div className="chat-input-area">
                        <input
                            type="text"
                            placeholder={t('placeholder', sessionLanguage)}
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                            disabled={typing}
                        />
                        <button onClick={handleSend} disabled={typing || !input.trim()}>
                            {t('send', sessionLanguage)}
                        </button>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<ChatApp />, document.getElementById('root'));
    </script>
</body>
</html>
